version: '3.8'

networks:
  kafka-net:

volumes:
  kafka_0_data:
  kafka_1_data:
  kafka_2_data:

x-kafka-common-base: &kafka-common_base
  image: bitnami/kafka:latest
  networks: [kafka-net]

x-kafka-common-env: &kafka-common_env
    BITNAMI_DEBUG: "true"
    KAFKA_KRAFT_CLUSTER_ID: 8h2Yc544QfKHuMmqig2OSA
    KAFKA_CFG_PROCESS_ROLES: broker,controller
    KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka-0:9093,1@kafka-1:9093,2@kafka-2:9093
    KAFKA_CFG_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:19092,CONTROLLER://0.0.0.0:9093
    KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
    KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
    KAFKA_CFG_INTER_BROKER_LISTENER_NAME: INTERNAL
    ALLOW_PLAINTEXT_LISTENER: "yes"

services:

  kafka-0:
    <<: *kafka-common_base
    container_name: kafka-0
    hostname: kafka-0
    ports:
      - "9092:19092"
    volumes:
      - kafka_0_data:/bitnami/kafka
    environment:
      <<: *kafka-common_env
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_ADVERTISED_LISTENERS: INTERNAL://kafka-0:9092,EXTERNAL://localhost:9092

  kafka-1:
    <<: *kafka-common_base
    container_name: kafka-1
    hostname: kafka-1
    ports:
      - "9192:19092"
    volumes:
      - kafka_1_data:/bitnami/kafka
    environment:
      <<: *kafka-common_env
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_ADVERTISED_LISTENERS: INTERNAL://kafka-1:9092,EXTERNAL://localhost:9192

  kafka-2:
    <<: *kafka-common_base
    container_name: kafka-2
    hostname: kafka-2
    ports:
      - "9292:19092"
    volumes:
      - kafka_2_data:/bitnami/kafka
    environment:
      <<: *kafka-common_env
      KAFKA_CFG_NODE_ID: 2
      KAFKA_CFG_ADVERTISED_LISTENERS: INTERNAL://kafka-2:9092,EXTERNAL://localhost:9292

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    networks: [kafka-net]
    depends_on: [kafka-0, kafka-1, kafka-2]
    ports:
      - "8880:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-0:9092,kafka-1:9192,kafka-2:9292