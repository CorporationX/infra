apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: main-ingress
spec:
  ingressClassName: nginx
  rules:
    - host: testhost
      http:
        paths:
          - path: "/goals"
            pathType: Prefix
            backend:
              service:
                name: user-service
                port:
                  number: 8080