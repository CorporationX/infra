apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: main-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$1
spec:
  ingressClassName: nginx
  rules:
    - host: testhost
      http:
        paths:
          - path: /users/?(.*)
            pathType: Prefix
            backend:
              service:
                name: user-service
                port:
                  number: 8080