global:
  scrape_interval: 10s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'spring-boot-app'
    metrics_path: /actuator/prometheus
    scrape_interval: 10s
    scrape_timeout: 8s
    static_configs:
      - targets: ['host.docker.internal:8079']
        labels:
          application: 'url_shortener'
          env: 'development'
          version: '1.0.0'
    metric_relabel_configs:
      - source_labels: [name]
        regex: '(hikaricp_.*|jvm_.*|http_server_.*|process_.*|system_.*|tomcat_.*)'
        action: keep